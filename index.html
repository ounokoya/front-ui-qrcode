<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/front-ui-qrcode/assets/favicon-32x32-DQjEQYWa.png">
    <title>Frontend Mentor | QR code component</title>
    <script type="module" crossorigin src="/front-ui-qrcode/assets/index-BLpJo2dK.js"></script>
    <link rel="stylesheet" crossorigin href="/front-ui-qrcode/assets/index-CqY1WK6y.css">
  </head>
  <!-- ADR-0006 : 3 rangées, la carte au centre de la fenêtre, le pied de page en bas -->
  <body class="grid min-h-dvh grid-rows-[1fr_auto_1fr] bg-slate-300 font-sans">
    <main class="row-start-2">
      <article class="mx-auto w-[min(20rem,100%_-_2rem)] rounded-card bg-white p-4 pb-9.75 text-center shadow-card">
        <img class="h-auto w-full rounded-image" src="/front-ui-qrcode/assets/image-qr-code-BXOTw09x.png" alt="QR code to frontendmentor.io" width="576" height="576">
        <h1 class="mt-6 px-4 text-title font-bold text-slate-900">Improve your front-end skills by building projects</h1>
        <p class="mt-4 px-4 text-body text-slate-500">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </article>
    </main>

    <footer class="row-start-3 self-end py-4 text-center text-attribution text-slate-900">
      Challenge by <a class="link" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a class="link" href="https://www.frontendmentor.io/profile/ounokoya">Koya Esdras</a>.
    </footer>
  </body>
</html>
